name: "grapevista_segmentation"
dataset:
  source: # Source of where to download the dataset ("kaglehub", "huggingface")
    type: "huggingface"
    #competition: "" # Kaggle competition name (if source is "kagglehub")
    repo: "links-ads/grapevista-dataset" # Huggingface repository name (if source is "huggingface")
  num_classes: 3
  labels: ["class1", "class2", "class3"]
  post_download_scripts: ["scripts/grapevista_prepare.py"]
  images_path: "data/grapevista/vitigeoss/images"
  masks_path: "data/grapevista/vitigeoss/annotations"
  #... Normal dataset parameters
model:
  - name: "unet"
    backbone: "resnet34"
    input_size: [800, 800]
training:
  lr: 0.001
  epochs: 10