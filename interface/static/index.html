<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VITIscan | Terminal</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <span class="brand">VITI<span class="scan">scan</span></span>
            <div class="status-chip"><div class="dot"></div> ONLINE</div>
        </header>

        <main class="content">
            <div class="viewport">
                <div id="uploadPlaceholder" class="placeholder">A aguardar Imagem...</div>
                <img id="previewImg" class="preview-img" alt="Folha Analisada">
            </div>

            <div class="controls">
                <input id="fileInput" type="file" accept="image/*" hidden>
                <button id="btnCamera" class="btn btn-main">Câmara</button>
                <button id="btnChoose" class="btn btn-sub">Galeria</button>
            </div>

            <section id="resultPanel" class="results" hidden>
                <div class="res-row">
                    <div class="res-block">
                        <label>Diagnóstico</label>
                        <div id="resDisease" class="value">--</div>
                    </div>
                    <div class="res-block">
                        <label>Confiança</label>
                        <div id="resConfidence" class="value">--</div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
